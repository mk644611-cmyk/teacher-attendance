<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Teacher Attendance</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .box {
      width: 100%;
      max-width: 450px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
    }

    h1 {
      margin-bottom: 20px;
    }

    video {
      width: 100%;
      max-width: 400px;
      border-radius: 15px;
      background: black;
      transform: scaleX(-1);
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background: #2196F3;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    #status {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>📷 Teacher Attendance</h1>

  <video id="camera" autoplay playsinline></video>

  <button onclick="startCamera()">
    START LIVE CAMERA
  </button>

  <div id="status">
    Camera not started
  </div>

</div>

<script>

let cameraStream = null;
let detector = null;
let detecting = false;

async function startCamera() {

  const video = document.getElementById("camera");
  const status = document.getElementById("status");

  try {

    status.innerText = "Starting camera...";

    cameraStream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user"
        },
        audio: false
      });

    video.srcObject = cameraStream;

    await video.play();

    status.innerText =
      "🔍 Looking for face...";

    detector = new FaceDetection({
      locateFile: function(file) {
        return "https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/" + file;
      }
    });

    detector.setOptions({
      model: "short",
      minDetectionConfidence: 0.5
    });

    detector.onResults(function(results) {

      if (
        results.detections &&
        results.detections.length > 0
      ) {

        status.innerText =
          "✅ FACE DETECTED";

      } else {

        status.innerText =
          "🔍 Looking for face...";

      }

    });

    detecting = true;

    detectLoop();

  } catch (error) {

    status.innerText =
      "❌ Camera Error: " + error.message;

  }
}


async function detectLoop() {

  if (!detecting) {
    return;
  }

  const video =
    document.getElementById("camera");

  if (
    video.readyState >= 2 &&
    detector
  ) {

    try {

      await detector.send({
        image: video
      });

    } catch (error) {

      console.log(error);

    }

  }

  requestAnimationFrame(detectLoop);
}

</script>

</body>
</html>
