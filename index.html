<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Teacher Attendance</title>

  <script type="module">

    import {
      FaceLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

    let faceLandmarker;
    let running = false;

    let blinkCount = 0;
    let eyeWasClosed = false;
    let livenessPassed = false;


    async function loadFaceModel() {

      const vision =
        await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
        );

      faceLandmarker =
        await FaceLandmarker.createFromOptions(
          vision,
          {
            baseOptions: {
              modelAssetPath:
                "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"
            },

            runningMode: "VIDEO",

            numFaces: 1,

            outputFaceBlendshapes: true
          }
        );
    }


    window.startCamera = async function () {

      const video =
        document.getElementById("camera");

      const status =
        document.getElementById("status");

      try {

        status.innerText =
          "Loading face system...";

        if (!faceLandmarker) {
          await loadFaceModel();
        }


        const stream =
          await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: "user"
            },
            audio: false
          });


        video.srcObject = stream;

        running = true;

        blinkCount = 0;
        eyeWasClosed = false;
        livenessPassed = false;


        status.innerText =
          "👁️ Please BLINK twice";


        detectFace();

      } catch (error) {

        status.innerText =
          "❌ ERROR: " + error.message;

      }
    };


    function detectFace() {

      if (!running) return;


      const video =
        document.getElementById("camera");


      if (video.readyState >= 2) {

        const result =
          faceLandmarker.detectForVideo(
            video,
            performance.now()
          );


        if (result.faceLandmarks.length === 0) {

          document.getElementById("status")
            .innerText =
            "❌ Face not detected";

        } else {

          if (
            result.faceBlendshapes &&
            result.faceBlendshapes.length > 0
          ) {

            const categories =
              result.faceBlendshapes[0].categories;


            let leftBlink = 0;
            let rightBlink = 0;


            for (const item of categories) {

              if (
                item.categoryName ===
                "eyeBlinkLeft"
              ) {
                leftBlink = item.score;
              }


              if (
                item.categoryName ===
                "eyeBlinkRight"
              ) {
                rightBlink = item.score;
              }
            }


            const blinkScore =
              (leftBlink + rightBlink) / 2;


            /*
              Eye closed
            */

            if (
              blinkScore > 0.55 &&
              !eyeWasClosed
            ) {

              eyeWasClosed = true;
            }


            /*
              Eye opened again
              = one blink
            */

            if (
              blinkScore < 0.25 &&
              eyeWasClosed
            ) {

              eyeWasClosed = false;

              blinkCount++;

              if (blinkCount < 2) {

                document.getElementById("status")
                  .innerText =
                  "✅ Blink 1/2 — Blink once more";

              }

              if (blinkCount >= 2) {

                livenessPassed = true;

                document.getElementById("status")
                  .innerText =
                  "✅ LIVENESS PASSED";
              }
            }
          }
        }
      }


      requestAnimationFrame(detectFace);
    }

  </script>


  <style>

    body {
      font-family: Arial;
      text-align: center;
      background: #f5f5f5;
      padding: 20px;
    }


    .box {
      max-width: 450px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
    }


    video {
      width: 100%;
      max-width: 400px;
      border-radius: 15px;
      background: black;
      transform: scaleX(-1);
    }


    button {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background: #2196F3;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }


    #status {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }

  </style>

</head>


<body>

  <div class="box">

    <h2>📷 Teacher Attendance</h2>

    <video
      id="camera"
      autoplay
      playsinline>
    </video>


    <button onclick="startCamera()">
      START LIVE CAMERA
    </button>


    <div id="status">
      Camera not started
    </div>

  </div>

</body>

</html>
